[project]
name = "z4j-bare"
version = "1.10.0"
description = "z4j framework-free agent bootstrapper (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "z4j contributors" }]
keywords = ["z4j", "agent", "task", "celery", "queue"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    # Intra-z4j floor policy: every z4j package in a release wave
    # is tested together, so intra-z4j floors track the wave version.
    # Mixed-version installs are refused rather than half-supported
    # (a 1.6.x mixed-dispatcher install was an RCE re-open, R9-H2).
    "z4j-core>=1.10.0,<2",
    "httpx>=0.28.1",
    "websockets>=16.0",
]

[project.scripts]
# 1.1.2+ console-script entry. ``z4j-bare`` (hyphen) is a thin
# wrapper around ``python -m z4j_bare`` - both forms work, both
# are supported. Operators choose based on shop convention; the
# hyphen form matches the pip distribution name.
z4j-bare = "z4j_bare.cli:main"

[project.optional-dependencies]
# Optional filesystem-watcher dependency. The Celery adapter starts it from
# its registry subscription when the literal ``Z4J_DEV_MODE`` environment
# variable is true and discovery supplied app paths. Passing ``dev_mode=True``
# only as programmatic agent configuration does not activate this watcher, and
# installing the extra alone does not start it.
watcher = [
    "watchdog>=6.0",
]

[project.urls]
Changelog = "https://github.com/z4jdev/z4j-bare/blob/main/CHANGELOG.md"
Documentation = "https://z4j.dev"
Homepage = "https://z4j.com"
Issues = "https://github.com/z4jdev/z4j-bare/issues"
Source = "https://github.com/z4jdev/z4j-bare"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z4j_bare"]
